<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- @@PAGE-START : 아래부터 Artifact 페이지 본문으로 사용됩니다 -->
<title>나사 너머</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 세로 한 화면 기준의 단일 열(최대 560px). 퍼즐 화면은 스크롤 없이 꽉 차고, 목록 화면만 세로 스크롤 */
:root {
  --bg: #16121d;
  --bg-glow: #2a1f3a;
  --surface: #241e2f;
  --surface-2: #2f2740;
  --line: #43395a;
  --text: #f5eff7;
  --muted: #aca3bc;
  --brass: #e6b45c;
  --brass-ink: #2b1d07;
  --heart: #ff8099;
  --ice: #a8def5;
  --paper: #f3eadb;
  --paper-ink: #2c2330;
  --paper-mute: #7d6d73;
  --f-display: "Bagel Fat One", "Black Han Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-heart: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 70%),
    var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--f-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; }
#app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; }

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.screen.play { overflow: hidden; gap: 8px; padding-block: 10px 12px; }

/* 공통 요소 */
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:focus-visible, .btn:focus-visible, .char-card:focus-visible, .stage-row:focus-visible, .tool:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 2px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface-2); font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.btn.wide { width: 100%; }
.btn svg { width: 20px; height: 20px; }
.section-label {
  margin: 6px 0 -4px; font-size: 12px; font-weight: 600;
  letter-spacing: .12em; color: var(--muted);
}
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar-title { flex: 1; min-width: 0; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-spacer { width: 44px; flex: none; }

/* 홈 */
.home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 8px; }
.logo {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(40px, 12vw, 58px); line-height: 1; letter-spacing: -.01em;
  color: var(--text);
  text-shadow: 0 3px 0 #0c0910;
}
.logo .bolt { color: var(--brass); }
.tagline { margin: 10px 0 0; font-family: var(--f-heart); font-size: 16px; color: var(--muted); }
.char-list { display: grid; gap: 12px; }
.char-card {
  display: flex; gap: 14px; align-items: stretch; text-align: left;
  padding: 10px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface); cursor: pointer;
}
.portrait {
  position: relative; flex: none; width: 96px; aspect-ratio: 3 / 4; max-width: 100%;
  border-radius: 14px; overflow: hidden; background-color: #0e0b12; background-repeat: no-repeat;
}
.char-card.locked .portrait { filter: blur(9px) brightness(.45) saturate(.3); }
.char-card.locked { cursor: default; }
.char-lock {
  position: absolute; left: 10px; top: 10px; width: 96px; aspect-ratio: 3 / 4;
  display: grid; place-items: center; color: var(--text); pointer-events: none;
}
.char-lock svg { width: 30px; height: 30px; }
.char-card { position: relative; }
.char-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; padding: 4px 2px; }
.char-name { font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.char-name small { margin-left: 8px; font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--accent); }
.char-role { font-size: 13px; color: var(--muted); }
.char-outer { font-size: 14px; }
.char-progress { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 5px; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--accent); }
.foot { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

/* 챕터 */
.chapter-hero { display: flex; gap: 16px; align-items: stretch; }
.hero-portrait { flex: none; width: 38%; max-width: 180px; aspect-ratio: 3 / 4; border-radius: 18px; background-repeat: no-repeat; box-shadow: 0 0 0 1px var(--line); }
.hero-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--accent); }
.hero-name { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; }
.hero-outer { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.hero-outer strong { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
.hero-progress { margin: auto 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gimmick-chip {
  align-self: flex-start; display: inline-flex; gap: 6px; align-items: center;
  padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line);
}
.stage-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.stage-row {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 60px; padding: 10px 14px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.stage-row[disabled] { cursor: default; opacity: .5; }
.stage-num {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: 50%; font-family: var(--f-display); font-size: 17px;
  background: #e9edf1; color: #2a3138;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}
.stage-row.cleared .stage-num { background: var(--accent); color: #1b1520; }
.stage-title { flex: 1; min-width: 0; font-weight: 600; }
.stage-title small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.stage-stars { font-size: 15px; letter-spacing: 2px; color: var(--brass); font-variant-numeric: tabular-nums; }
.stage-stars .off { color: var(--line); }
.stage-row svg { width: 18px; height: 18px; color: var(--muted); }
.card-list { display: grid; gap: 10px; }

/* 마음 조각: 종이 쪽지 */
.fragment {
  margin: 0; padding: 16px 18px 18px; border-radius: 6px 18px 6px 18px;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 10px 24px rgba(0,0,0,.35);
}
.fragment-type { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--paper-mute); }
.fragment h3 { margin: 0 0 8px; font-family: var(--f-heart); font-size: 19px; font-weight: 700; text-wrap: balance; }
.fragment-quote { margin: 0 0 8px; font-family: var(--f-heart); font-size: 17px; font-weight: 700; line-height: 1.6; color: #8a2f48; }
.fragment-body { margin: 0; font-family: var(--f-heart); font-size: 15px; line-height: 1.75; white-space: pre-line; }
.fragment.locked {
  background: transparent; color: var(--muted); box-shadow: none;
  border: 1.5px dashed var(--line);
}
.fragment.locked h3 { color: var(--muted); }
.fragment.bonus { background: #2b2236; color: var(--text); border: 1px solid var(--heart); }
.fragment.bonus .fragment-type { color: var(--heart); }

/* 퍼즐 화면 */
.play-head { display: flex; align-items: center; gap: 10px; }
.play-titles { flex: 1; min-width: 0; text-align: center; }
.play-titles strong { display: block; font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.15; }
.play-titles span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud {
  display: flex; justify-content: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums;
}
.hud span { padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.hud b { color: var(--brass); font-weight: 600; }
.hud-bar { position: relative; min-height: 44px; display: flex; align-items: center; justify-content: center; }
.coach {
  position: absolute; left: 0; right: 0; top: 0; min-height: 100%; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 14px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--brass);
  font-size: 14px; line-height: 1.45; text-align: center; text-wrap: balance; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.stage-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { display: block; touch-action: none; max-width: 100%; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 62px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer;
}
.tool svg { width: 24px; height: 24px; }
.tool .count {
  position: absolute; top: 6px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 11px;
  background: var(--brass); color: var(--brass-ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.tool[disabled] { opacity: .4; cursor: default; }
.tool.active { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.tool.active .count { background: var(--brass-ink); color: var(--brass); }

/* 시트(결과·막힘·설정) */
.sheet {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(9, 7, 12, .72);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.sheet-card {
  width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding: 20px; border-radius: 24px;
  background: var(--surface); border: 1px solid var(--line);
  animation: rise .32s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; }
.sheet-card p { margin: 0; }
.sheet-card .muted { color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 120px; }
.result-stars { font-size: 40px; letter-spacing: 6px; text-align: center; color: var(--brass); line-height: 1; }
.result-stars .off { color: var(--line); }
.result-meta { text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.reward { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; text-align: center; }
.reward b { color: var(--brass); }
.reveal-title { text-align: center; font-family: var(--f-heart); font-size: 15px; color: var(--heart); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.setting-row span small { display: block; color: var(--muted); font-size: 12px; }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface-2); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--brass); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--brass-ink); }

/* 일러스트 감상 */
.viewer {
  position: fixed; inset: 0; z-index: 30; background: #08060b;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.viewer img { flex: 1; min-height: 0; max-width: 100%; object-fit: contain; border-radius: 12px; }
.viewer-cap { font-family: var(--f-heart); color: var(--muted); text-align: center; }
.viewer-cap strong { color: var(--text); font-family: var(--f-display); font-weight: 400; font-size: 22px; display: block; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 40; max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 12px;
  background: var(--paper); color: var(--paper-ink); font-size: 14px; font-weight: 600; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce) {
  .sheet-card { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="screen-home" aria-label="캐릭터 선택"></section>
  <section class="screen" id="screen-chapter" aria-label="캐릭터 이야기" hidden></section>
  <section class="screen play" id="screen-play" aria-label="퍼즐" hidden>
    <div class="play-head">
      <button class="icon-btn" id="btn-back" aria-label="목록으로"></button>
      <div class="play-titles"><strong id="play-title"></strong><span id="play-sub"></span></div>
      <button class="icon-btn" id="btn-restart" aria-label="다시 하기"></button>
    </div>
    <div class="hud-bar">
      <div class="hud"><span id="hud-moves"></span><span id="hud-goal"></span></div>
      <div class="coach" id="coach" role="status" hidden></div>
    </div>
    <div class="stage-wrap" id="stage-wrap">
      <canvas id="board" aria-label="나사 퍼즐 보드"></canvas>
    </div>
    <div class="tools">
      <button class="tool" id="tool-hammer"></button>
      <button class="tool" id="tool-hole"></button>
      <button class="tool" id="tool-hint"></button>
    </div>
  </section>
  <div class="sheet" id="sheet" hidden></div>
  <div class="viewer" id="viewer" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="rules.js"></script>
<script src="content.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
<!-- @@PAGE-END -->
</body>
</html>
