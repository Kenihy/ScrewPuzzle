<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121114">
<!-- 휴대폰 홈 화면에 추가하면 주소창 없이 앱처럼 전체 화면으로 실행됩니다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="언스크류">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="언스크류(UNCREW) — 풀수록, 더 깊이 얽힌다. 첫 사건 P0 프로토타입">
<title>언스크류 UNCREW</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- 웹 폰트는 선택 사항입니다. 네트워크가 없으면 시스템 글꼴로 표시됩니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
  <main id="app" aria-live="off">
    <section class="screen" style="display:grid;place-items:center;text-align:center">
      <div>
        <div style="font-family:var(--f-title);font-size:40px;font-weight:900">언스크류</div>
        <div style="letter-spacing:.5em;color:var(--gold)">UNCREW</div>
        <noscript><p>이 프로토타입은 JavaScript가 필요합니다.</p></noscript>
        <p class="muted" style="font-size:13px">불러오는 중…</p>
      </div>
    </section>
  </main>
  <aside id="side" aria-label="노트 (넓은 화면)"></aside>
</div>
<div id="debug" hidden></div>
<!-- 실행용 단일 스크립트(src/를 묶은 것). 파일을 직접 열어도(file://) 동작합니다. 원본 수정 후 node tools/build.mjs -->
<script src="uncrew.bundle.js"></script>
</body>
</html>
